# 下级模型选择表。由 dispatch.sh source；改模型只需要改这里。
# 每一项都可用同名环境变量临时覆盖，例如 PRIMARY_MODEL=xxx scripts/agent/dispatch.sh <id>。
#
# 主力：NVIDIA 的 Super。前两次尝试都用它。
# 备选：DeepSeek。两种情况下接手：
#   1) 主力调用本身失败（限流、服务报错、超时），同一次分发内立即改用备选，不计入失败次数；
#   2) 门禁已连续失败两次，第三次尝试换成备选，换一个模型家族的视角。

# 主力：走 ~/.codex/nvidia.config.toml 这个 profile（provider 与模型目录都在里面）
PRIMARY_PROFILE="${PRIMARY_PROFILE:-nvidia}"
PRIMARY_MODEL="${PRIMARY_MODEL:-nvidia/nemotron-3.5-super-vl-120b-a12b}"

# 备选：显式指定 provider，不依赖 ~/.codex/config.toml 当前的默认值
FALLBACK_PROVIDER="${FALLBACK_PROVIDER:-deepseek}"
FALLBACK_MODEL="${FALLBACK_MODEL:-deepseek-v4-pro}"

# 从第几次尝试开始改用备选
FALLBACK_FROM_ATTEMPT="${FALLBACK_FROM_ATTEMPT:-3}"

# 推理强度按任务类型（tasks/<id>/tier 的内容）决定
EFFORT_mechanical="low"    # 清告警、改名、格式调整等不需要设计判断的任务
EFFORT_logic="high"        # 修 bug、加功能、重构
