name: whisper
description: "耳语 Whisper：端到端加密聊天与语音客户端（Flutter，Windows / Linux 优先）。"
publish_to: 'none'

version: 1.0.3+5

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  convert: ^3.1.2
  crypto: ^3.0.6
  cryptography: ^2.7.0
  audioplayers: ^6.5.1
  file_selector: ^1.0.4
  flutter_secure_storage: ^9.0.0
  flutter_webrtc: 1.6.3
  package_info_plus: ^8.3.1
  path: ^1.8.3
  path_provider: ^2.1.2
  qr_flutter: ^4.1.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  super_clipboard: ^0.8.24
  tray_manager: ^0.5.2
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  window_manager: ^0.5.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/incoming_ring.wav
    - assets/sounds/ringback.wav
    - assets/sounds/message_chime.wav
    - assets/icons/whisper.png
    - assets/icons/app_icon.ico

# sqlite3 用带加密支持的 SQLite3 Multiple Ciphers 构建，本地数据库整库加密
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
