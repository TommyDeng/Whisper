name: webrtc-spike

on:
  pull_request:
  push:
    branches:
      - feat/webrtc-spike
      - main

permissions:
  contents: read

concurrency:
  group: webrtc-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signaling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/signaling
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spike/signaling/package-lock.json
      - run: npm ci
      - run: npx wrangler types
      - run: npm run typecheck
      - run: npm test

  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install desktop libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libglu1-mesa libpulse-dev libasound2-dev
          sudo apt-get install -y libstdc++-14-dev || sudo apt-get install -y libstdc++-15-dev || sudo apt-get install -y g++
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.9
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Pack the Linux bundle
        working-directory: .
        run: tar -C spike/client/build/linux/x64/release -czf whisper-webrtc-spike-linux.tar.gz bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: whisper-webrtc-spike-linux
          path: whisper-webrtc-spike-linux.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spike/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.9
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: whisper-webrtc-spike-windows
          path: spike/client/build/windows/x64/runner/Release
          if-no-files-found: error
