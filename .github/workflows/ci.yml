name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signaling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx wrangler types
      - run: npm run typecheck
      - run: npm test

  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      # 只分析主工程；spike/ 是独立工程，由 webrtc-spike 工作流负责
      - run: flutter analyze --no-fatal-infos lib test
      - run: flutter test

  build-linux:
    runs-on: ubuntu-latest
    needs: flutter-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libglu1-mesa libpulse-dev libasound2-dev libsecret-1-dev
          sudo apt-get install -y libstdc++-14-dev || sudo apt-get install -y libstdc++-15-dev || sudo apt-get install -y g++
          sudo apt-get install -y dpkg-dev fakeroot squashfs-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.9
          cache: true
      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            PUBSPEC_VERSION="$(./packaging/version.sh)"
            if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
              echo "标签 v${TAG_VERSION} 与 pubspec.yaml 版本 ${PUBSPEC_VERSION} 不一致" >&2
              exit 1
            fi
            echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(./packaging/version.sh)" >> "$GITHUB_ENV"
          fi
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Pack Linux packages
        env:
          OUTPUT_DIR: dist
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf "dist/whisper-${VERSION}-linux-x64.tar.gz" bundle
          ./packaging/linux/build-deb.sh
          ./packaging/linux/build-appimage.sh
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: flutter-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.9
          cache: true
      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            PUBSPEC_VERSION="$(./packaging/version.sh)"
            if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
              echo "标签 v${TAG_VERSION} 与 pubspec.yaml 版本 ${PUBSPEC_VERSION} 不一致" >&2
              exit 1
            fi
            echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(./packaging/version.sh)" >> "$GITHUB_ENV"
          fi
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Pack portable zip
        shell: bash
        run: |
          mkdir -p dist
          tar -C build/windows/x64/runner/Release -a -cf "dist/Whisper-${VERSION}-windows-x64.zip" .
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:VERSION" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item "packaging/windows/output/Whisper-Setup-$env:VERSION-x64.exe" dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect files and SHA256SUMS
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp -t dist {} +
          ls -l dist
          (cd dist && sha256sum * > ../SHA256SUMS && mv ../SHA256SUMS .)
          cat dist/SHA256SUMS
      - name: Sign SHA256SUMS with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            echo "缺少 GitHub Actions secret：GPG_PRIVATE_KEY 或 GPG_PASSPHRASE。配置方法见 docs/release.md。" >&2
            exit 1
          fi
          umask 077
          tmp="$(mktemp)"
          cleanup() { rm -f "$tmp"; }
          trap cleanup EXIT
          if printf '%s' "$GPG_PRIVATE_KEY" | grep -q "BEGIN PGP"; then
            printf '%s\n' "$GPG_PRIVATE_KEY" > "$tmp"
          else
            printf '%s' "$GPG_PRIVATE_KEY" | base64 -d > "$tmp"
          fi
          gpg --batch --import "$tmp"
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --detach-sign --armor -o dist/SHA256SUMS.asc dist/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: dist/*
          fail_on_missing_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
