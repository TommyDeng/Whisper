# 项目配置：流水线里所有和具体项目有关的东西都在这里。由脚本 source（bash 语法）。
# 门禁始终读主检出里的这份，下级改不到。
#
# SETUP_CMD              首次分发前在任务 worktree 里执行一次（装依赖）。沙箱里可能没有网络。
# CHECKS                 每个任务都要通过的检查命令，在任务 worktree 根目录执行。
# CONDITIONAL_CHECKS     只有改到匹配路径才跑的检查，格式：<路径正则> => <命令>
# SANDBOX_WRITABLE_DIRS  下级沙箱里除 worktree 外还要能写的目录（工具缓存等），不存在的会跳过。
# CODEX_EXTRA_ARGS       追加给 codex exec 的参数。
# DISPATCH_CLEAN_PATHS   分发前必须已提交的路径（放验收测试的目录）。
# WORKER_HINTS           写进给下级的提示里的一句项目注意事项。

SETUP_CMD="flutter pub get"
CHECKS=(
  # info 级问题不阻断（仓库基线里已有）；error/warning 阻断
  "flutter analyze --no-fatal-infos lib test"
  "flutter test"
)
CONDITIONAL_CHECKS=(
  # 只有改到 worker/ 才跑信令服务的检查
  '^worker/ => cd worker && { [[ -d node_modules ]] || npm ci; } && npx wrangler types && npm run typecheck && npm test'
)
SANDBOX_WRITABLE_DIRS=(
  # flutter 命令自身要写 SDK 的 bin/cache 和 ~/.dart-tool
  "$(dirname "$(readlink -f "$(command -v flutter)")")/cache"
  "$HOME/.dart-tool"
)
# 不加载本机的插件和无关 MCP，省启动时间和上下文
CODEX_EXTRA_ARGS=(--disable plugins -c mcp_servers.rea.enabled=false)
DISPATCH_CLEAN_PATHS=(test worker/test)
WORKER_HINTS="依赖已装好，flutter 命令请加 \`--no-pub\`。"
